name: Sync to GitLab

# Push to the GitLab mirror immediately after every merge to main.
# This replaces the ~60-minute GitLab scheduled pull with near-instant sync.
#
# Required GitHub secret:
#   GITLAB_SYNC_TOKEN  — GitLab project access token with write_repository scope
#                        on gitlab.com/nhl/mop/observe (project ID 82778463)

on:
  push:
    branches: [main]

jobs:
  sync:
    name: Mirror → gitlab.com/nhl/mop/observe
    runs-on: ubuntu-latest
    steps:
      - name: Mirror clone and push to GitLab
        run: |
          # Bare mirror clone contains only real refs (no remote-tracking refs),
          # so GitLab won't reject the push with "deny updating a hidden ref".
          git clone --mirror https://github.com/beengud/observe.git repo
          cd repo
          git push --mirror \
            "https://oauth2:${{ secrets.GITLAB_SYNC_TOKEN }}@gitlab.com/nhl/mop/observe.git"
