# .gitlab-ci.yml — observe CLI fork (gitlab.com/nhl/mop/observe)
#
# This repo is a GitLab mirror of github.com/beengud/observe.
# On every push to main it:
#   1. Runs unit tests
#   2. Builds a linux/amd64 binary
#   3. Uploads the binary to the mop-config project's generic package registry
#   4. Opens an MR in mop-config bumping OBSERVE_CLI_VERSION to the new build
#
# Required CI/CD variable (set in this project's Settings → CI/CD → Variables):
#   MOP_CONFIG_PAT  — GitLab personal/project access token with `api` scope
#                     on the nhl/mop group (used to upload packages and
#                     create MRs in mop-config)

stages:
  - test
  - publish

variables:
  MOP_CONFIG_PROJECT_ID: "82631227"   # nhl/mop/mop-config
  GOFLAGS: "-mod=vendor"

# ── Test ──────────────────────────────────────────────────────────────────────

test:
  stage: test
  image: golang:1.21-alpine
  script:
    - go test ./...

# ── Publish (main branch only) ────────────────────────────────────────────────

publish:
  stage: publish
  image: golang:1.21-alpine
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  before_script:
    - apk add --no-cache git curl
  script:
    - |
      # Version: use git tag if this commit is tagged, else main-<short sha>
      VERSION="${CI_COMMIT_TAG:-main-${CI_COMMIT_SHORT_SHA}}"
      echo "Building observe-cli ${VERSION} (linux/amd64)"

      CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
        go build -o observe-linux-amd64 .

      echo "Binary size: $(du -sh observe-linux-amd64 | cut -f1)"

      # Upload binary to mop-config project package registry
      echo "Uploading to mop-config package registry..."
      curl --fail --silent --show-error \
        --header "PRIVATE-TOKEN: ${MOP_CONFIG_PAT}" \
        --upload-file observe-linux-amd64 \
        "${CI_API_V4_URL}/projects/${MOP_CONFIG_PROJECT_ID}/packages/generic/observe-cli/${VERSION}/observe-linux-amd64"
      echo "Uploaded observe-cli ${VERSION}"

      # Clone mop-config and open an MR bumping OBSERVE_CLI_VERSION
      git clone \
        "https://oauth2:${MOP_CONFIG_PAT}@${CI_SERVER_HOST}/nhl/mop/mop-config.git" \
        mop-config-repo
      cd mop-config-repo

      git config user.email "observe-ci@nhl.com"
      git config user.name "observe-ci"

      BRANCH="auto/observe-cli-${VERSION}"
      git checkout -b "${BRANCH}"

      sed -i "s/OBSERVE_CLI_VERSION:.*/OBSERVE_CLI_VERSION: \"${VERSION}\"/" .gitlab-ci.yml

      git add .gitlab-ci.yml
      git commit -m "chore: bump observe CLI to ${VERSION}"
      git push \
        "https://oauth2:${MOP_CONFIG_PAT}@${CI_SERVER_HOST}/nhl/mop/mop-config.git" \
        "${BRANCH}"

      # Create MR in mop-config
      curl --fail --silent --show-error \
        --request POST \
        --header "PRIVATE-TOKEN: ${MOP_CONFIG_PAT}" \
        --header "Content-Type: application/json" \
        --data "{
          \"source_branch\": \"${BRANCH}\",
          \"target_branch\": \"main\",
          \"title\": \"chore: bump observe CLI to ${VERSION}\",
          \"description\": \"Auto-generated by [observe CI pipeline](${CI_PIPELINE_URL}).\",
          \"remove_source_branch\": true
        }" \
        "${CI_API_V4_URL}/projects/${MOP_CONFIG_PROJECT_ID}/merge_requests"

      echo "MR created in mop-config — review and merge to deploy ${VERSION}"
